plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.gradle.userdev' version '7.0.170'
	id 'net.neoforged.gradle.mixin' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
	// Define wrapper values here so as to not have to always do so when updating gradlew.properties.
	// Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
	// documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
	// file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
	// (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
	distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

//mixin {
//	config "terrastorage.client.mixins.json"
//}

sourceSets {
	main {
		// Include resources generated by data generators.
		resources {
			srcDir 'src/generated/resources'
		}
	}
	client {
		resources {
			srcDir 'src/generated/resources'
		}
	}
}

// runs arguments
runs {
	// applies to all the run configs below
	configureEach {
		// Recommended logging data for a userdev environment
		// The markers can be added/remove as needed separated by commas.
		// "SCAN": For mods scan.
		// "REGISTRIES": For firing of registry events.
		// "REGISTRYDUMP": For getting the contents of all registries.
		systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

		// Recommended logging level for the console
		// You can set various levels here.
		// Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
		systemProperty 'forge.logging.console.level', 'debug'

		// Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
		systemProperty 'forge.enabledGameTestNamespaces', 'tacz'

		dependencies {
//            runtime project.configurations.libraries
		}

		modSources {
			add project.sourceSets.main
			add project.sourceSets.client
		}
	}

	client {
//        jvmArgs "-XX:+AllowEnhancedClassRedefinition"
		// 每个启动单独区分文件夹
		workingDirectory project.file('runs/client')
		systemProperty 'mixin.env.remapRefMap', 'true'
		systemProperty 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"
		programArguments.addAll '--username', 'Dev', '--width', '400', '--height', '200'
		dependencies {
//            runtime("curse.maven:jei-238222:5846880")
//            runtime("mezz.jei:jei-1.21.1-neoforge:19.21.0.247")
		}
	}

	server {
		workingDirectory project.file('runs/server')
		programArgument '--nogui'
		systemProperty 'mixin.env.disableRefMap', 'true'
		systemProperty 'mixin.env.remapRefMap', 'true'
		systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
	}

	data {
		workingDirectory project.file('runs/data')
		systemProperty 'mixin.env.disableRefMap', 'true'
		programArguments.addAll '--mod', 'tacz', '--all', '--output', file('src/generated/resources/').getAbsolutePath()
	}
}

repositories {
	mavenCentral()
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url 'https://maven.wispforest.io' }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.su5ed.dev/releases" } // forgified fabric api
	maven {
		url "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	flatDir {
		dir 'libs'
	}
}

configurations {
	nightConfigExtract
}

dependencies {
	implementation "net.neoforged:neoforge:${neo_version}"

//	// Fabric API.
//	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.fabric_version}"

	// NightConfig.
	nightConfigExtract implementation("com.electronwill.night-config:core:${project.night_config_version}")
	nightConfigExtract implementation("com.electronwill.night-config:toml:${project.night_config_version}")

	// ModMenu integration.
	compileOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// Expanded Storage compatibility.
	compileOnly "curse.maven:expanded-storage-978068:${project.expanded_storage_version}"
}

tasks.register("extractNightConfig", Copy) {
	from {
		configurations.nightConfigExtract.collect { zipTree(it) }
	}
	into layout.buildDirectory.dir("nightconfig")
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
	inputs.property "version", project.version

	filesMatching("neoforge.mods.toml") {
		expand "version": project.version
	}
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	dependsOn("extractNightConfig")

	from(layout.buildDirectory.dir("nightconfig")) {
		into ""
	}

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

